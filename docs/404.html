<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduListen - Lớp Tiếng Trung</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = path.split('/').filter(Boolean)[0] || '';
      var target = repo ? '/' + repo + '/' : './';
      window.location.replace(target);
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #faf8f5; color: #334155;">
    <div style="text-align: center;">
      <h2 style="font-size: 1.1rem; font-weight: 600;">Đang chuyển hướng vào hệ thống học tập...</h2>
      <p style="font-size: 0.85rem; color: #64748b;">Vui lòng đợi giây lát</p>
    </div>
  </body>
</html>
