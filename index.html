<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 1. Only patch window.fetch if inside an iframe wrapper (e.g. AI Studio dev environment)
      if (window.self !== window.top) {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      }

      // 2. Trailing slash normalization for GitHub Pages
      if (location.hostname.endsWith('github.io')) {
        var parts = location.pathname.split('/').filter(Boolean);
        if (parts.length === 1 && !location.pathname.endsWith('/')) {
          location.replace(location.pathname + '/' + location.search + location.hash);
        }
      }
    </script>
    <title>EduListen - Luyện nghe & Trả lời bằng Giọng nói</title>
    <meta name="description" content="Nền tảng luyện nghe trực tuyến có chức năng ghi âm câu trả lời, giáo viên chấm điểm trực tiếp và theo dõi tiến độ học sinh toàn diện." />
    <meta property="og:title" content="EduListen - Luyện nghe & Trả lời bằng Giọng nói" />
    <meta property="og:description" content="Nền tảng luyện nghe trực tuyến có chức năng ghi âm câu trả lời, giáo viên chấm điểm trực tiếp và theo dõi tiến độ học sinh toàn diện." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased text-slate-900 selection:bg-rose-500/20 selection:text-rose-950 bg-[#faf8f5]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background-color: #faf8f5; color: #1e293b; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #fecdd3; border-top-color: #be123c; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 1.15rem; font-weight: 700; margin: 0 0 6px 0;">Đang khởi chạy EduListen · 华语学堂</h2>
        <p style="font-size: 0.85rem; color: #64748b; margin: 0; max-width: 420px; line-height: 1.5;">Hệ thống đang tải tài nguyên lớp học tiếng Trung và bộ âm thanh phát âm...</p>
        <noscript>
          <div style="margin-top: 16px; padding: 12px; background: #fff1f2; border: 1px solid #fda4af; border-radius: 8px; font-size: 0.8rem; color: #9f1239;">
            Trình duyệt của bạn đang tắt JavaScript. Vui lòng bật JavaScript để sử dụng phần mềm.
          </div>
        </noscript>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>

    <!-- Hybrid Universal Loader: Works both in Vite dev server (AI Studio) and static GitHub Pages -->
    <script type="module">
      var isDev = location.hostname.includes('run.app') || location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.port === '3000';
      if (isDev) {
        import('/src/main.tsx');
      } else {
        // We are on GitHub Pages or static server!
        var basePath = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
        // Dynamically insert compiled CSS
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = basePath + 'dist/assets/index-DLJ6eOf-.css';
        document.head.appendChild(link);
        // Dynamically import compiled JS bundle
        import(basePath + 'dist/assets/index-CJcLsWQF.js').catch(function(err) {
          console.warn('Failed loading dist bundle, trying docs bundle:', err);
          import(basePath + 'docs/assets/index-CJcLsWQF.js');
        });
      }
    </script>
  </body>
</html>
